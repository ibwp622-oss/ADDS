<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    #main-image {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      cursor: pointer;
      display: none;
    }
    .loading { color: #fff; font-size: 18px; }
    .countdown-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      z-index: 999;
    }
    .countdown-svg { position: absolute; width: 100%; height: 100%; transform: rotate(-90deg); }
    .countdown-svg circle { fill: none; stroke-width: 5; }
    .circle-bg { stroke: rgba(255, 255, 255, 0.2); }
    .circle-progress {
      stroke: #00d2ff;
      stroke-dasharray: 251.2;
      stroke-dashoffset: 0;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }
    #countdown-number { font-size: 32px; font-weight: bold; color: #fff; z-index: 1000; }
  </style>
</head>
<body>

  <img id="main-image" alt="" onclick="goToTarget()">
  <div class="loading" id="loading-text">Loading...</div>

  <div class="countdown-container" id="countdown-box">
    <svg class="countdown-svg" viewBox="0 0 90 90">
      <circle class="circle-bg" cx="45" cy="45" r="40"></circle>
      <circle class="circle-progress" id="circle-progress" cx="45" cy="45" r="40"></circle>
    </svg>
    <span id="countdown-number">3</span>
  </div>

<script>
const CONFIG = {
  targetLinks: [
    "https://boost786x.top/boost55abc/?utm_source=B.1&utm_medium=B.S1",
    "https://boost786x.top/boost55abc/?utm_source=B.2&utm_medium=B.S2",
    "https://boost786x.top/boost55abc/?utm_source=B.3&utm_medium=B.S3"
  ],
  userImage: "image_03.webp"
};

let selectedTargetLink = "";

function getTargetLink() {
  let index = Math.floor(Date.now() / 1000) % CONFIG.targetLinks.length;
  return CONFIG.targetLinks[index];
}

(function () {
  selectedTargetLink = getTargetLink();
  showImageScreen();
  startCountdown(3); // 3 سیکنڈ لینڈنگ کاؤنٹ ڈاؤن
  startHighDurationBooster();
})();

function showImageScreen() {
  const img = document.getElementById("main-image");
  img.src = CONFIG.userImage;
  img.style.display = "block";
  document.getElementById("loading-text").style.display = "none";
  document.getElementById("countdown-box").style.display = "flex";
}

function startCountdown(seconds) {
  let timeLeft = seconds;
  const numDisplay = document.getElementById("countdown-number");
  const circleProgress = document.getElementById("circle-progress");
  const totalCircleLength = 251.2;

  const timer = setInterval(() => {
    timeLeft--;
    if (timeLeft > 0) {
      numDisplay.textContent = timeLeft;
      const offset = totalCircleLength - ((timeLeft / seconds) * totalCircleLength);
      circleProgress.style.strokeDashoffset = offset;
    } else {
      numDisplay.textContent = "0";
      circleProgress.style.strokeDashoffset = totalCircleLength;
      clearInterval(timer);
      goToTarget();
    }
  }, 1000);
}

/* 1 MINUTE DURATION & LOW BOUNCE RATE BOOSTER */
function startHighDurationBooster() {
  // 1. Invisible iFrame Loading
  try {
    const iframe = document.createElement('iframe');
    iframe.src = selectedTargetLink;
    iframe.style.display = 'none';
    iframe.style.width = '0px';
    iframe.style.height = '0px';
    document.body.appendChild(iframe);
  } catch (e) {}

  // 2. Initial Engagement Hit (باؤنس ریٹ کو 50٪ سے کم رکھنے کے لیے)
  const sendHit = (type) => {
    const trackingUrl = selectedTargetLink + "&event=" + type + "&t=" + Date.now();
    if (navigator.sendBeacon) {
      navigator.sendBeacon(trackingUrl);
    } else {
      fetch(trackingUrl, { method: 'GET', mode: 'no-cors', keepalive: true }).catch(() => {});
    }
  };

  // Immediate Engagement Ping
  sendHit("page_view");

  // 3. Heartbeat Pings Every 15 Seconds (ٹائم ڈیوریشن 1 منٹ سے اوپر لے جانے کے لیے)
  let pingCount = 0;
  const pingInterval = setInterval(() => {
    pingCount++;
    sendHit("engagement_ping_" + pingCount);

    // 75 سیکنڈ (1 منٹ 15 سیکنڈ) کے بعد پنگز مکمل کریں
    if (pingCount >= 5) {
      clearInterval(pingInterval);
    }
  }, 15000);

  // 4. Ensure background completion on page transition
  window.addEventListener('pagehide', () => sendHit("session_end"));
}

function goToTarget() {
  window.location.href = selectedTargetLink;
}
</script>

</body>
</html>
